[workspace]
members = [
  "crates/winctl",
  "crates/winctl-macro",
  "crates/winctl-memory",
  "crates/winctl-mcp-server",
  "crates/winctl-test-target",
  "crates/winctl-tray",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_System_ProcessStatus",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_EventLog",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }
windows-capture = "2"
rmcp = { version = "0.5", features = ["server", "transport-io", "transport-worker", "transport-streamable-http-server"] }
regex = "1"
roxmltree = "0.20"
base64 = "0.22"
image = "0.25"
gif = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "=0.1.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
winit = "0.30"
wry = "0.55.1"
