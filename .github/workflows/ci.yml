name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WINDOWS_TARGET: x86_64-pc-windows-gnu

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Windows cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          rustup default stable
          rustup component add rustfmt
          rustup target add "${WINDOWS_TARGET}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/winctl-mcp-server/dashboard/package-lock.json

      - name: Build dashboard assets
        run: |
          cd crates/winctl-mcp-server/dashboard
          npm ci
          npm run build

      - name: Format check
        run: cargo fmt --all --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Build Windows MCP server
        run: make build-win-server

      - name: Build Windows tray
        run: make build-win-tray

  windows-runtime:
    name: Windows runtime integration
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Install Rust GNU target
        shell: pwsh
        run: |
          rustup default stable
          rustup target add $env:WINDOWS_TARGET
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Windows workspace
        shell: pwsh
        run: cargo build --workspace --target $env:WINDOWS_TARGET

      - name: Locate Windows UI test target
        shell: pwsh
        run: |
          $target = Resolve-Path "target\$env:WINDOWS_TARGET\debug\winctl-test-target.exe"
          "WINCTL_TEST_TARGET_EXE=$target" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Windows runtime integration tests
        shell: pwsh
        run: cargo test --workspace --target $env:WINDOWS_TARGET -- --nocapture
